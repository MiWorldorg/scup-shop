name: CI

on:
  # Deliberately manual until the owner authorizes final verification.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Laravel quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, sodium, sqlite3
          coverage: none
      - name: Prepare environment
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Generate application key
        run: php artisan key:generate --force
      - name: Check formatting
        run: vendor/bin/pint --test
      - name: Run backend tests
        run: php artisan test

  flutter-quality:
    name: Flutter quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test

  flutter-build:
    name: Flutter build (${{ matrix.target }})
    needs: [backend-quality, flutter-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            runner: ubuntu-latest
            command: flutter build web
          - target: android
            runner: ubuntu-latest
            command: flutter build apk
          - target: windows
            runner: windows-latest
            command: flutter build windows
          - target: linux
            runner: ubuntu-latest
            command: flutter build linux
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Enable desktop targets
        if: matrix.target == 'windows' || matrix.target == 'linux'
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Build target
        run: ${{ matrix.command }}
