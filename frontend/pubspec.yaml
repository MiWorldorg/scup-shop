name: sculpture_shop
description: "A responsive sculpture storefront and admin dashboard."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  responsive_framework: ^1.4.0
  flutter_spinkit: ^5.2.1
  get: ^4.7.3
  carousel_slider: ^5.1.2
  flutter_svg: ^2.0.10+1
  persistent_bottom_nav_bar: ^6.2.1
  accordion: ^2.6.0
  animate_do: ^3.3.4
  ionicons: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/products/
    - assets/images/gallery/
    - assets/images/posts/
    - assets/images/
    - assets/svgs/
  fonts:
    - family: NotoSerifDisplay
      fonts:
        - asset: assets/fonts/NotoSerifDisplay/NotoSerifDisplay-SemiBold.ttf
          weight: 600
